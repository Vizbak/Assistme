<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Framehouse — Film OS</title><style>body{margin:0;background:#090909;color:#f4f0e8;font:14px system-ui,sans-serif}*{box-sizing:border-box}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{border-right:1px solid #292929;padding:28px 18px}.brand{font:30px Georgia,serif;margin-bottom:35px}.brand small{display:block;font:10px system-ui;color:#888;letter-spacing:.15em;text-transform:uppercase;margin-top:6px}.nav{display:grid;gap:4px}.nav button{border:0;background:none;color:#888;text-align:left;padding:11px 12px;border-radius:7px}.nav button.active,.nav button:hover{background:#191919;color:#fff}.main{min-width:0}.top{height:72px;border-bottom:1px solid #292929;display:flex;align-items:center;justify-content:space-between;padding:0 38px}.crumb{font-size:11px;color:#888;letter-spacing:.12em;text-transform:uppercase}.signin,.btn{background:#f4f0e8;color:#111;border:1px solid #f4f0e8;border-radius:6px;padding:10px 14px;font-weight:700}.btn.ghost,.signin{background:#171717;color:#f4f0e8;border-color:#383838}.content{max-width:1450px;margin:auto;padding:42px 38px 80px}.view{display:none}.view.active{display:block}.hero{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:35px}.eyebrow{font-size:10px;color:#888;letter-spacing:.16em;text-transform:uppercase}.hero h1{font:400 clamp(48px,7vw,84px)/.9 Georgia,serif;margin:10px 0}.muted{color:#888}.actions{display:flex;gap:8px;flex-wrap:wrap}.stats,.grid,.crew{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats{grid-template-columns:repeat(4,1fr)}.stat,.card,.detail,.person,.row{background:#111;border:1px solid #292929;border-radius:8px}.stat{padding:18px}.stat b{display:block;font:400 35px Georgia,serif}.stat span{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.1em}.section{margin-top:34px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}.sectionhead h2{font:400 25px Georgia,serif;margin:0}.card{padding:18px}.card h3{font:400 30px Georgia,serif;margin:18px 0 8px}.pill,.urgency,.level{display:inline-block;border:1px solid #393939;border-radius:999px;padding:4px 8px;font-size:9px;text-transform:uppercase;letter-spacing:.08em}.bar{height:4px;background:#292929;margin-top:18px}.bar i{display:block;height:100%;background:#eee}.cardfoot{display:flex;justify-content:space-between;color:#888;font-size:11px;margin-top:12px}.row{display:flex;align-items:center;gap:12px;padding:13px 15px;margin-bottom:7px}.rowmain{flex:1}.rowmain small{display:block;color:#888}.urgency.high{color:#d8897c}.urgency.medium{color:#d6b674}.urgency.low{color:#a8c8ad}.check{width:17px;height:17px}.detail{padding:22px;margin-top:18px}.detailhead{display:flex;justify-content:space-between;gap:20px}.detail h2{font:400 50px/.95 Georgia,serif;margin:12px 0}.tabs{display:flex;gap:18px;border-bottom:1px solid #292929;margin:24px 0 18px}.tab{border:0;background:none;color:#888;padding:10px 2px;border-bottom:2px solid transparent}.tab.active{color:#fff;border-color:#fff}.timeline{position:relative}.timeline:before{content:"";position:absolute;left:14px;top:18px;bottom:20px;width:1px;background:#383838}.stage{position:relative;display:grid;grid-template-columns:40px 1fr 80px;gap:14px;align-items:center;padding:14px 0}.dot{width:28px;height:28px;border-radius:50%;border:1px solid #444;background:#111;display:grid;place-items:center;z-index:1;font-size:10px}.stage.done .dot{background:#eee;color:#111}.stage.current .dot{box-shadow:0 0 0 5px #282828}.stage h3{font:400 20px Georgia,serif;margin:0}.stage small{color:#888}.stagebar{height:5px;background:#292929;margin-top:7px;border-radius:5px}.stagebar i{display:block;height:100%;background:#eee}.right{text-align:right;color:#888;font-size:9px}.crew{grid-template-columns:repeat(2,1fr)}.person{padding:15px}.person h3{font:400 23px Georgia,serif;margin:0 0 5px}.history{padding:10px 0;border-bottom:1px solid #292929;color:#888}.history b{color:#fff}.empty{border:1px dashed #333;border-radius:8px;padding:55px 20px;text-align:center;color:#888;grid-column:1/-1}.empty b{display:block;color:#fff;font:400 34px Georgia,serif;margin-bottom:7px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.open{display:flex}.modalbox{width:min(620px,100%);background:#151515;border:1px solid #383838;border-radius:10px;padding:24px}.fields{display:grid;gap:12px}.fields label{font-size:10px;color:#888;text-transform:uppercase;letter-spacing:.1em}.fields input,.fields select,.fields textarea{width:100%;display:block;margin-top:6px;background:#0d0d0d;color:#fff;border:1px solid #353535;border-radius:6px;padding:11px}.modalhead{display:flex;justify-content:space-between}.modal h2{font:400 34px Georgia,serif;margin:0 0 20px}.x{border:0;background:none;color:#888;font-size:24px}@media(max-width:850px){.app{display:block}.side{border-right:0;border-bottom:1px solid #292929}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.grid,.stats{grid-template-columns:1fr 1fr}.main{margin:0}.content{padding:28px 18px}}@media(max-width:600px){.grid,.stats,.crew{grid-template-columns:1fr}.hero{display:block}.detailhead{display:block}.stage{grid-template-columns:40px 1fr}.right{display:none}}</style></head><body><div class="app"><aside class="side"><div class="brand">Framehouse<small>Film OS</small></div><nav class="nav"><button class="active" data-view="dashboard">Overview</button><button data-view="projects">Projects</button><button data-view="tasks">Tasks</button><button data-view="schedule">Schedule</button><button data-view="people">People</button></nav></aside><main class="main"><header class="top"><div class="crumb" id="crumb">Workspace / Overview</div><button class="signin" id="signin">Sign in with Google</button></header><div class="content"><section id="dashboard" class="view active"><div class="hero"><div><div class="eyebrow">Production workspace</div><h1>Make the film.<br>Run the machine.</h1></div><div><p class="muted">Projects, tasks, crew and production progress in one place.</p><div class="actions"><button class="btn" data-new="project">+ New project</button><button class="btn ghost" data-view="tasks">View tasks</button></div></div></div><div id="stats" class="stats"></div><div class="section"><div class="sectionhead"><h2>Current slate</h2><button class="btn ghost" data-view="projects">All projects</button></div><div id="dash" class="grid"></div></div></section><section id="projects" class="view"><div class="hero"><div><div class="eyebrow">Slate</div><h1>Projects</h1></div><button class="btn" data-new="project">+ New project</button></div><div id="projectGrid" class="grid"></div><div id="detail" class="detail" style="display:none"></div></section><section id="tasks" class="view"><div class="hero"><div><div class="eyebrow">Production</div><h1>Tasks</h1></div><button class="btn" data-new="task">+ Add task</button></div><div id="taskList"></div></section><section id="schedule" class="view"><div class="hero"><div><div class="eyebrow">Calendar</div><h1>Schedule</h1></div></div><div id="scheduleList"></div></section><section id="people" class="view"><div class="hero"><div><div class="eyebrow">Collaboration</div><h1>People</h1></div><button class="btn" data-new="person">+ Add person</button></div><div id="peopleList" class="crew"></div></section></div></main></div><div id="projectModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>New project</h2><button class="x" data-close>×</button></div><form id="projectForm" class="fields"><label>Project title<input name="name" required></label><label>Format<select name="type"><option>Feature</option><option>Short</option><option>Series</option><option>Documentary</option></select></label><label>Status<select name="status"><option>Development</option><option>Pre-production</option><option>Production</option><option>Post-production</option><option>Complete</option></select></label><label>Target date<input name="date" type="date"></label><label>Notes<textarea name="desc" rows="4"></textarea></label><button class="btn">Create project</button></form></div></div><div id="taskModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>Add task</h2><button class="x" data-close>×</button></div><form id="taskForm" class="fields"><label>Task<input name="name" required></label><label>Project<select name="project" id="taskProject"></select></label><label>Due date<input name="date" type="date"></label><label>Sense of urgency<select name="urgency"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High — urgent</option></select></label><label>Responsible person<select name="person" id="taskPerson"></select></label><button class="btn">Add task</button></form></div></div><div id="personModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>Add person</h2><button class="x" data-close>×</button></div><form id="personForm" class="fields"><label>Name<input name="name" required></label><label>Role<input name="role"></label><label>Phone<input name="phone"></label><label>Email<input name="email" type="email"></label><label>Contribution<select name="level"><option>Lead</option><option>Core</option><option>Supporting</option><option>Consulting</option><option>External</option></select></label><button class="btn">Add to crew</button></form></div></div><script>
const KEY='framehouse-final',PEOPLE=KEY+'-people';let projects=JSON.parse(localStorage.getItem(KEY)||'[]'),people=JSON.parse(localStorage.getItem(PEOPLE)||'[]'),selected=null,tab='tasks';const $=id=>document.getElementById(id),uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random(),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stages=['Development','Pre-production','Production','Post-production','Complete'];const templates={Feature:['Lock screenplay','Finalize budget','Attach key crew','Casting','Locations','Production schedule','Call sheets','Principal photography','Edit assembly','Picture lock','Color / sound / delivery'],Short:['Lock screenplay','Finalize budget','Crew key departments','Casting','Location scout','Shot list & schedule','Production day','Principal photography','Edit assembly','Picture lock & finishing','Final export'],Series:['Series bible','Lock episode scripts','Season budget','Attach department heads','Casting','Location plan','Master production schedule','Episode production','Editorial workflow','Picture lock & finishing','Delivery package'],Documentary:['Research & access','Treatment','Budget','Crew','Archive / rights plan','Production schedule','Principal photography','Assembly edit','Picture lock','Mix / grade','Delivery']};function save(){localStorage.setItem(KEY,JSON.stringify(projects));localStorage.setItem(PEOPLE,JSON.stringify(people));render()}function go(v){document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===v));$('crumb').textContent='Workspace / '+v[0].toUpperCase()+v.slice(1);if(v!=='projects')selected=null;render()}function stage(p){let s=stages.indexOf(p.status);let t=p.tasks||[],pct=t.length?t.filter(x=>x.done).length/t.length:0;return Math.min(4,Math.max(0,s,Math.floor(pct*5)))}function card(p){let t=p.tasks||[],d=t.filter(x=>x.done).length,pct=t.length?Math.round(d/t.length*100):0;return `<article class="card"><div><span class="pill">${esc(p.type)}</span> <span class="pill">${esc(p.status)}</span></div><h3>${esc(p.name)}</h3><p class="muted">${esc(p.desc||'No notes yet.')}</p><div class="bar"><i style="width:${pct}%"></i></div><div class="cardfoot"><span>${pct}% · ${stages[stage(p)]}</span><span>${p.date||'No target'}</span></div><div class="actions" style="margin-top:14px"><button class="btn ghost" data-open="${p.id}">Open project →</button><button class="btn ghost" data-newtask="${p.id}">+ Task</button></div></article>`}function taskRow(t,p){let person=people.find(x=>x.id===t.person);return `<div class="row"><input class="check" type="checkbox" data-toggle="${p.id}|${t.id}" ${t.done?'checked':''}><div class="rowmain"><b>${esc(t.name)}</b><small>${esc(p.name)} · ${person?esc(person.name):'Unassigned'}${t.done&&t.completedBy?' · Completed by '+esc(t.completedBy):''}</small></div><span class="urgency ${t.urgency||'medium'}">${t.urgency||'medium'}</span><span class="muted">${esc(t.date||'')}</span></div>`}function timeline(p){let i=stage(p),all=p.tasks||[],done=all.filter(x=>x.done).length,pct=all.length?Math.round(done/all.length*100):0;return `<div class="timeline">${stages.map((s,n)=>`<div class="stage ${n<i?'done':''} ${n===i?'current':''}"><div class="dot">${n<i?'✓':n+1}</div><div><h3>${s}</h3><small>${n<i?'Stage complete':n===i?'Current project level':'Upcoming stage'}</small><div class="stagebar"><i style="width:${n<i?100:n===i?Math.max(8,pct):0}%"></i></div></div><div class="right">${n===i?'CURRENT':n<i?'COMPLETE':'NEXT'}</div></div>`).join('')}</div>`}function detail(p){let all=p.tasks||[],open=all.filter(x=>!x.done),done=all.filter(x=>x.done),crew=people.filter(x=>all.some(t=>t.person===x.id));$('detail').style.display='block';$('detail').innerHTML=`<div class="detailhead"><div><span class="pill">${esc(p.status)}</span><h2>${esc(p.name)}</h2><p class="muted">${esc(p.type)} · ${p.date||'No target'}</p></div><div class="actions"><button class="btn ghost" data-newtask="${p.id}">+ Add task</button><button class="btn ghost" data-tab="timeline">Timeline</button><button class="btn ghost" data-close-detail>Close</button></div></div><p class="muted">${esc(p.desc||'No notes yet.')}</p><div class="tabs"><button class="tab ${tab==='tasks'?'active':''}" data-tab="tasks">Tasks</button><button class="tab ${tab==='timeline'?'active':''}" data-tab="timeline">Timeline</button><button class="tab ${tab==='people'?'active':''}" data-tab="people">People involved</button><button class="tab ${tab==='history'?'active':''}" data-tab="history">Completion history</button></div><div id="body"></div>`;let html=tab==='timeline'?timeline(p):tab==='people'?(crew.length?crew.map(x=>`<div class="person"><h3>${esc(x.name)}</h3><div class="muted">${esc(x.role)}</div><div class="muted">${esc(x.phone||'No phone')}</div><div class="muted">${esc(x.email||'No email')}</div><span class="level">${esc(x.level)}</span></div>`).join(''):'<div class="empty"><b>No crew assigned.</b>Assign people to tasks.</div>'):tab==='history'?(done.length?done.map(x=>`<div class="history"><b>${esc(x.name)}</b> — completed by ${esc(x.completedBy||'Workspace user')}</div>`).join(''):'<div class="muted">No completed tasks yet.</div>'):`<div class="sectionhead"><h2>Open tasks</h2><span class="muted">${open.length} remaining</span></div>${open.map(x=>taskRow(x,p)).join('')||'<div class="muted">All tasks complete.</div>'}<div class="sectionhead" style="margin-top:25px"><h2>Completed</h2></div>${done.map(x=>taskRow(x,p)).join('')}`;$('body').innerHTML=html;$('detail').scrollIntoView({behavior:'smooth',block:'start'})}function render(){let all=projects.flatMap(p=>(p.tasks||[]).map(t=>({...t,p}))),open=all.filter(x=>!x.done),done=all.filter(x=>x.done),urgent=open.filter(x=>x.urgency==='high').length;$('stats').innerHTML=`<div class="stat"><b>${projects.length}</b><span>Projects</span></div><div class="stat"><b>${open.length}</b><span>Open tasks</span></div><div class="stat"><b>${urgent}</b><span>Urgent</span></div><div class="stat"><b>${done.length}</b><span>Completed</span></div>`;let c=projects.map(card).join('');$('dash').innerHTML=c||empty('Start your slate.','Create your first project.');$('projectGrid').innerHTML=c||empty('No projects yet.','Your slate is blank.');$('taskList').innerHTML=open.concat(done).map(x=>taskRow(x,x.p)).join('')||empty('Nothing on the board.','Create a project first.');$('scheduleList').innerHTML=open.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date)).map(x=>taskRow(x,x.p)).join('')||empty('No dated tasks.','Add due dates to see them here.');$('peopleList').innerHTML=people.length?people.map(x=>`<div class="person"><h3>${esc(x.name)}</h3><div class="muted">${esc(x.role)}</div><div class="muted">${esc(x.phone||'No phone')}</div><div class="muted">${esc(x.email||'No email')}</div><span class="level">${esc(x.level)}</span></div>`).join(''):empty('Your crew starts here.','Add collaborators and contacts.');if(selected){let p=projects.find(x=>x.id===selected);if(p)detail(p)}}function empty(a,b){return `<div class="empty"><b>${a}</b>${b}</div>`}function openTask(pid){if(!projects.length){openModal('projectModal');return}$('taskProject').innerHTML=projects.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');$('taskPerson').innerHTML='<option value="">Unassigned</option>'+people.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');if(pid)$('taskProject').value=pid;openModal('taskModal')}function openModal(id){$(id).classList.add('open')}function close(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'))}
document.addEventListener('click',e=>{let v=e.target.closest('[data-view]');if(v){go(v.dataset.view);return}let n=e.target.closest('[data-new]');if(n){n.dataset.new==='project'?openModal('projectModal'):n.dataset.new==='task'?openTask():openModal('personModal');return}let o=e.target.closest('[data-open]');if(o){selected=o.dataset.open;tab='tasks';go('projects');selected=o.dataset.open;detail(projects.find(x=>x.id===selected));return}let nt=e.target.closest('[data-newtask]');if(nt){openTask(nt.dataset.newtask);return}let tb=e.target.closest('[data-tab]');if(tb&&selected){tab=tb.dataset.tab;detail(projects.find(x=>x.id===selected));return}if(e.target.closest('[data-close]')||e.target.closest('[data-close-detail]')){if(e.target.closest('[data-close-detail]')){$('detail').style.display='none';selected=null}else close();return}});document.addEventListener('change',e=>{let x=e.target.closest('[data-toggle]');if(!x)return;let [pid,tid]=x.dataset.toggle.split('|'),p=projects.find(a=>a.id===pid),t=p.tasks.find(a=>a.id===tid);t.done=x.checked;t.completedBy=t.done?(people.find(a=>a.id===t.person)?.name||'Workspace user'):'';save();if(selected)detail(p)});$('projectForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),type=f.get('type'),names=templates[type]||templates.Feature;projects.unshift({id:uid(),name:f.get('name').trim(),type,status:f.get('status'),date:f.get('date'),desc:f.get('desc').trim(),tasks:names.map((n,i)=>({id:uid(),name:n,done:false,date:'',urgency:i<2?'high':i<5?'medium':'low',person:'',completedBy:''}))});e.target.reset();close();save();go('projects')};$('taskForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=projects.find(x=>x.id===f.get('project'));p.tasks.push({id:uid(),name:f.get('name').trim(),date:f.get('date'),done:false,urgency:f.get('urgency'),person:f.get('person'),completedBy:''});e.target.reset();close();save();go('tasks')};$('personForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);people.push({id:uid(),name:f.get('name').trim(),role:f.get('role').trim(),phone:f.get('phone').trim(),email:f.get('email').trim(),level:f.get('level')});e.target.reset();close();save();go('people')};$('signin').onclick=()=>alert('Google sign-in requires the Google provider to be enabled in Supabase Auth.');render();</script></body></html>
